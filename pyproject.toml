[project]
name = "ventilation-advisor"
version = "0.1.0"
description = "Home Assistant custom integration that recommends when to open or close windows"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["homeassistant>=2026.11"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
